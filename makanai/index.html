<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3a2a20">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MAKANAI">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>MAKANAI — 賄い</title>
<style>
:root{
  color-scheme: light;
  --surface-1:#fcfcfb;
  --surface-2:#f4f1ea;
  --surface-3:#e9e5db;
  --line:#ded9cd;
  --text-primary:#0b0b0b;
  --text-secondary:#52514e;
  --text-muted:#84827b;
  --accent:#c2552b;
  --accent-soft:#fbeee7;
  --series-1:#2a78d6;
  --series-2:#eb6834;
  --series-3:#1baf7a;
  --good:#1baf7a;
  --warn:#eda100;
  --bad:#e34948;
  --grid:#e8e5de;
  --radius:14px;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --surface-1:#1a1a19;
    --surface-2:#242422;
    --surface-3:#2f2f2c;
    --line:#383835;
    --text-primary:#ffffff;
    --text-secondary:#c3c2b7;
    --text-muted:#8f8e85;
    --accent:#d9683c;
    --accent-soft:#33221a;
    --series-1:#3987e5;
    --series-2:#d95926;
    --series-3:#199e70;
    --good:#199e70;
    --warn:#c98500;
    --bad:#e66767;
    --grid:#2f2f2c;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--surface-2);
  color:var(--text-primary);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;
  font-size:15px;line-height:1.6;
  padding-bottom:calc(72px + var(--safe-b));
  -webkit-font-smoothing:antialiased;
}
header{
  position:sticky;top:0;z-index:20;
  background:var(--surface-1);border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px;
}
.h-row{display:flex;align-items:baseline;gap:10px}
.h-title{font-size:17px;font-weight:700;letter-spacing:.08em}
.h-sub{font-size:12px;color:var(--text-muted);margin-left:auto}
main{padding:14px 14px 24px;max-width:640px;margin:0 auto}
.view{display:none}
.view.on{display:block}
.card{
  background:var(--surface-1);border:1px solid var(--line);
  border-radius:var(--radius);padding:14px;margin-bottom:12px;
}
.card h2{font-size:14px;margin:0 0 10px;font-weight:700;letter-spacing:.02em}
.card h2 .sub{font-weight:400;color:var(--text-muted);font-size:12px;margin-left:6px}
.muted{color:var(--text-muted);font-size:12.5px}
.sec-label{font-size:11.5px;color:var(--text-muted);letter-spacing:.08em;margin:18px 4px 8px;font-weight:600}
button{font:inherit;color:inherit;cursor:pointer}
.btn{
  display:block;width:100%;border:0;border-radius:12px;padding:14px;
  background:var(--accent);color:#fff;font-weight:700;font-size:16px;
}
.btn:disabled{opacity:.45}
.btn-ghost{background:var(--surface-2);color:var(--text-primary);border:1px solid var(--line);font-weight:600;font-size:14px;padding:11px}
.btn-danger{background:transparent;color:var(--bad);border:1px solid var(--line);font-weight:600;font-size:14px;padding:11px}
.btn-sm{padding:8px 12px;font-size:13px;border-radius:10px;width:auto;display:inline-block}
.row{display:flex;gap:8px}
.row>*{flex:1}
input,select,textarea{
  font:inherit;width:100%;padding:10px 12px;border-radius:10px;
  border:1px solid var(--line);background:var(--surface-1);color:var(--text-primary);
}
textarea{resize:vertical;min-height:60px}
label.f{display:block;margin-bottom:10px}
label.f span{display:block;font-size:12px;color:var(--text-muted);margin-bottom:4px}
/* --- 日付ヘッダ --- */
.datebar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.datebar .d{flex:1;text-align:center;font-weight:700;font-size:15px}
.datebar button{border:1px solid var(--line);background:var(--surface-1);border-radius:10px;width:38px;height:34px;color:var(--text-secondary)}
/* --- 数値サマリ --- */
.hero{display:flex;align-items:baseline;gap:6px}
.hero b{font-size:30px;font-weight:700;letter-spacing:-.01em}
.hero .u{font-size:13px;color:var(--text-muted)}
.bar{height:8px;border-radius:99px;background:var(--surface-3);overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .25s}
.bar i.over{background:var(--bad)}
.bar i.ok{background:var(--good)}
.kv{display:flex;justify-content:space-between;font-size:12.5px;color:var(--text-secondary);padding:3px 0}
.kv b{font-weight:700;color:var(--text-primary)}
/* --- 食事スロット --- */
.slot{border-top:1px solid var(--line);padding:11px 0 9px}
.slot:first-of-type{border-top:0;padding-top:2px}
.slot-head{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.slot-name{font-weight:700;font-size:14px}
.slot-kcal{margin-left:auto;font-size:12.5px;color:var(--text-muted)}
.meal{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:14px}
.meal .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meal .v{font-size:12.5px;color:var(--text-muted);font-variant-numeric:tabular-nums}
.meal .x{border:0;background:transparent;color:var(--text-muted);padding:2px 6px;font-size:16px;line-height:1}
.meal .tap{flex:1;min-width:0;display:flex;align-items:center;gap:8px;border:0;background:transparent;
  padding:2px 0;text-align:left;font:inherit;color:inherit}
.meal .tap .v{margin-left:auto}
.prep-row{border-top:1px solid var(--line);padding:9px 0}
.star{border:1px solid var(--line);background:var(--surface-2);color:var(--text-secondary);
  font-size:12px;font-weight:600;line-height:1;padding:6px 10px;border-radius:999px;margin-left:8px;white-space:nowrap}
.star.on{color:#fff;background:var(--accent);border-color:var(--accent)}
.star.kept{color:var(--text-primary);background:var(--surface-3)}
.add{border:1px dashed var(--line);background:transparent;color:var(--text-secondary);
  border-radius:10px;padding:8px;width:100%;font-size:13px;font-weight:600}
.tag{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:99px;
  background:var(--accent-soft);color:var(--accent);margin-left:6px;vertical-align:1px}
.tag.g{background:var(--surface-3);color:var(--text-muted)}
/* --- チップ --- */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface-2);
  border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;color:var(--text-secondary)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.sm{padding:5px 10px;font-size:12px}
/* --- モーダル --- */
.ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:none;align-items:flex-end}
.ov.on{display:flex}
.sheet{background:var(--surface-1);width:100%;max-width:640px;margin:0 auto;
  border-radius:18px 18px 0 0;padding:16px 16px calc(16px + var(--safe-b));
  max-height:88vh;overflow:auto}
.sheet h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center}
.sheet h3 .x{margin-left:auto;border:0;background:transparent;color:var(--text-muted);font-size:20px;line-height:1}
.pick{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;
  background:transparent;border-bottom:1px solid var(--line);padding:11px 2px;font-size:14px}
.pick .n{flex:1;min-width:0}
.pick .v{font-size:12px;color:var(--text-muted);font-variant-numeric:tabular-nums}
/* --- 買い物・準備リスト --- */
.li{display:flex;gap:9px;align-items:flex-start;padding:8px 2px;border-bottom:1px solid var(--line);font-size:14px}
.li:last-child{border-bottom:0}
.li input[type=checkbox]{width:19px;height:19px;flex:0 0 auto;margin-top:2px;accent-color:var(--accent)}
.li .n{flex:1}
.li.done .n{color:var(--text-muted);text-decoration:line-through}
/* --- グラフ --- */
.chart{width:100%;display:block}
.legend{font-size:11.5px;color:var(--text-muted);margin-top:2px}
/* --- ナビ --- */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  display:flex;background:var(--surface-1);border-top:1px solid var(--line);
  padding-bottom:var(--safe-b);
}
nav button{flex:1;border:0;background:transparent;color:var(--text-muted);
  padding:9px 0 11px;font-size:11px;font-weight:600}
nav button .ic{display:block;font-size:19px;line-height:1.35}
nav button.on{color:var(--accent)}
/* --- トースト --- */
.toast{position:fixed;left:50%;bottom:calc(84px + var(--safe-b));transform:translateX(-50%);
  background:#111;color:#fff;padding:10px 16px;border-radius:99px;font-size:13px;
  z-index:80;opacity:0;pointer-events:none;transition:opacity .25s;max-width:88vw;text-align:center}
.toast.on{opacity:.95}
.spin{display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,.35);
  border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.warn{background:var(--accent-soft);border:1px solid var(--line);border-radius:12px;
  padding:11px 12px;font-size:13px;color:var(--text-secondary);margin-bottom:12px}
</style>
</head>
<body>

<header>
  <div class="h-row">
    <div class="h-title">MAKANAI</div>
    <div class="h-sub" id="h-sub"></div>
  </div>
</header>

<main>
  <!-- ============ 今日 ============ -->
  <section id="v-today" class="view on">
    <div class="datebar">
      <button onclick="shiftDay(-1)">‹</button>
      <div class="d" id="date-label"></div>
      <button onclick="shiftDay(1)">›</button>
    </div>
    <div id="today-body"></div>
  </section>

  <!-- ============ 計画 ============ -->
  <section id="v-plan" class="view">
    <div id="plan-body"></div>
  </section>

  <!-- ============ 記録 ============ -->
  <section id="v-log" class="view">
    <div id="log-body"></div>
  </section>

  <!-- ============ 設定 ============ -->
  <section id="v-set" class="view">
    <div id="set-body"></div>
  </section>
</main>

<nav>
  <button data-view="today" class="on"><span class="ic">●</span>今日</button>
  <button data-view="plan"><span class="ic">▤</span>計画</button>
  <button data-view="log"><span class="ic">▲</span>記録</button>
  <button data-view="set"><span class="ic">◇</span>設定</button>
</nav>

<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* ==========================================================================
   MAKANAI（賄い）— 自分ひとりの栄養とカロリーを管理する
   ・在庫の正本は Prep（献立帳）。ここはコピーを持たず直接読み書きする
   ・Prep のコードには一切手を入れない
   ・栄養計算はこのアプリが行う（Prep 側の値には依存しない）
   ========================================================================== */

const KEY  = 'makanai.v1';
const AKEY = 'makanai_api_key';
const PREP_KEY = 'kondate_cho_v1';   // 献立帳（Prep）— 在庫と調理履歴の正本
const KIHON_KEY = 'kihon.v1';        // KIHON — 体重とトレ日

const SLOTS = [
  {id:'breakfast', name:'朝食'},
  {id:'lunch',     name:'昼食'},
  {id:'dinner',    name:'夕食'},
  {id:'snack',     name:'間食'},
];
const SLOT_NAME = Object.fromEntries(SLOTS.map(s=>[s.id,s.name]));

/* たんぱく質の量。除脂肪体重が分かるときは lbm、分からないときは体重に bw を掛ける。
   lbm 側の 1.6〜2.2 g/kg は、減量中に筋肉を保つ目的での一般的な範囲。
   bw 側はそれを体脂肪込みの体重に換算した、ざっくりの近似値 */
const PROTEIN_LEVELS = [
  { id:'low',  n:'控えめ',   bw:1.2, lbm:1.6 },
  { id:'mid',  n:'ふつう',   bw:1.4, lbm:1.8 },
  { id:'high', n:'しっかり', bw:1.6, lbm:2.0 },
  { id:'max',  n:'多め',     bw:1.8, lbm:2.2 },
];
function levelOf(id){ return PROTEIN_LEVELS.find(l=>l.id===id) || PROTEIN_LEVELS[2]; }
/* 除脂肪体重。体脂肪率が未入力なら null */
function lbmOf(p){
  const w = num(p.weightKg), f = num(p.bodyFatPct);
  if(!w || !f || f <= 0 || f >= 70) return null;
  return Math.round(w * (1 - f/100) * 10) / 10;
}
function proteinTargetOf(p){
  const L = levelOf(p.proteinLevel);
  const lbm = lbmOf(p);
  if(lbm) return { g: Math.round(lbm * L.lbm), basis:'除脂肪体重', per: L.lbm, base: lbm };
  if(num(p.weightKg)) return { g: Math.round(num(p.weightKg) * L.bw), basis:'体重', per: L.bw, base: num(p.weightKg) };
  return { g: null, basis:'', per:L.bw, base:null };
}

/* カルシウムの推奨量（日本人の食事摂取基準・成人女性）。骨量が落ちる年代なので献立で意識させる */
const CALCIUM_TARGET = 650;

/* 塩分の目標量（日本人の食事摂取基準・成人女性）。上限として扱う */
const SALT_MAX = 6.5;

/* 保存したものの初期セット。数値はすべて目安なので、実物に合わせて設定で直す */
const SEED_FAV = [
  {name:'ごはん 150g',           slot:'breakfast', kcal:234, protein:3.8,  salt:0},
  {name:'納豆 1パック',           slot:'breakfast', kcal:100, protein:8.3,  salt:0.6},
  {name:'卵 1個',                slot:'breakfast', kcal:71,  protein:6.1,  salt:0.2},
  {name:'味噌汁 1杯',             slot:'breakfast', kcal:40,  protein:2.2,  salt:1.2},
  {name:'無糖ヨーグルト 100g',    slot:'breakfast', kcal:56,  protein:3.6,  salt:0.1},
  {name:'バナナ 1本',             slot:'breakfast', kcal:86,  protein:1.1,  salt:0},
  {name:'食パン 6枚切1枚',        slot:'breakfast', kcal:158, protein:5.6,  salt:0.7},
  {name:'サラダチキン 1個',       slot:'lunch',     kcal:110, protein:24,   salt:1.1},
  {name:'おにぎり 1個',           slot:'lunch',     kcal:180, protein:3.5,  salt:1.0},
  {name:'定食（外食）',           slot:'lunch',     kcal:700, protein:28,   salt:4.0},
  {name:'ハンバーガーセット',      slot:'lunch',     kcal:900, protein:25,   salt:3.5},
  {name:'牛丼 並',                slot:'lunch',     kcal:635, protein:20,   salt:2.7},
  {name:'ラーメン 1杯',           slot:'dinner',    kcal:500, protein:20,   salt:6.0},
  {name:'プロテイン 1杯',         slot:'snack',     kcal:120, protein:20,   salt:0.2},
  {name:'素焼きナッツ 25g',       slot:'snack',     kcal:150, protein:5,    salt:0},
];

/* タグについて：自動でタグを生やさない。分類は下の固定2軸だけで、これ以上増やさない。
   　・時間帯（朝食/昼食/夕食/間食）… SLOTS
   　・弁当にできるか（true/false）
   Prep のようにAIがタグを付ける方式は、細かすぎて管理が破綻したので採らない。 */

const DEF = {
  app:'makanai', schema:1,
  /* proteinLevel … たんぱく質の量（控えめ〜多め）。実際の g は下の PROTEIN_LEVELS で決まる。
     bodyFatPct を入れると除脂肪体重（＝筋肉・骨・内臓）基準になる。
     たんぱく質が必要なのは体脂肪ではなく除脂肪部分なので、体脂肪が多い人ほど
     体重基準は過大に出る。体脂肪率が分かるならそちらを使う。 */
  profile:{ age:null, heightCm:null, weightKg:null, bodyFatPct:null,
            activity:1.375, goal:0.88, proteinLevel:'high' },
  targets:{ manual:false, kcal:null, protein:null },
  prefs:{ avoid:'', likes:'', model:'claude-opus-5', trainBonus:200, bento:true, useFav:true },
  days:{},          // 'YYYY-MM-DD' -> {meals:[...], weightKg}
  /* 保存したもの（レシピ帳）。1つのリストで、2つの軸で役割が変わる。
     ・材料を持つ（ingredients あり）… 作れる。「作った」で在庫が減る
     ・star が true … お気に入り。献立づくりで優先的に使う
     材料はあるが star でないもの＝「控えておくだけ」。献立には出てこない。
     {id,name,slot,bento,star,kcal,protein,salt,ingredients:[],steps:[],memo,uses} */
  favorites:[],
  plan:null,        // 直近に作った献立計画
  planHistory:[],   // 直近5件。上書きで消えると困るので取っておく
  /* 「残りのカロリーで組む」提案。1日ぶんだけ持つ（計画とは別枠）。
     {date, meals:[...], at} — 計画を上書きしないよう、あえて分けている */
  fill:null,
  /* AI が出した料理を自動で控えておく（新しい順・最大40品）。
     保存も★も押さないまま消してしまった提案の救済と、次に作るときの選択肢用。
     捨てても・上書きされても、ここには残る */
  suggested:[],
  nutrition:{},     // Prepレシピid -> {kcal,protein,salt,at}  ← このアプリが計算した値
  imported:[],      // 取り込み済みの Prep 履歴id
};

let S = null;
let apiKey = '';
let cursor = todayKey();   // 今日タブが表示している日
let busy = false;

/* ---------- 基本ユーティリティ ---------- */
function uid(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36); }
function pad(n){ return String(n).padStart(2,'0'); }
function keyOf(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function todayKey(){ return keyOf(new Date()); }
function dateOf(k){ const [y,m,d]=k.split('-').map(Number); return new Date(y,m-1,d); }
function addDays(k,n){ const d=dateOf(k); d.setDate(d.getDate()+n); return keyOf(d); }
function labelOf(k){
  const d=dateOf(k), w='日月火水木金土'[d.getDay()];
  const rel = k===todayKey() ? '今日' : (k===addDays(todayKey(),-1) ? '昨日' : (k===addDays(todayKey(),1)?'明日':''));
  return `${d.getMonth()+1}月${d.getDate()}日(${w})` + (rel?` ・${rel}`:'');
}
function num(v){ const n=Number(v); return Number.isFinite(n)?n:0; }
function fmt(n){ return Math.round(n).toLocaleString('ja-JP'); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function normName(n){ return String(n||'').trim().toLowerCase().replace(/\s/g,''); }

function toast(msg, ms){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('on');
  clearTimeout(toast._t);
  toast._t=setTimeout(()=>t.classList.remove('on'), ms||2400);
}

/* ---------- 保存 ---------- */
/* KIHON など他アプリが読むための今日ぶんの要約。
   目標値の計算式をよそに複製させないため、算出済みの数字をここに置く */
function updateSummary(){
  try{
    const k = todayKey(), t = targetsFor(k), tot = totals(k);
    S.summary = { date:k,
      kcal:Math.round(tot.kcal), kcalTarget:t.kcal,
      protein:Math.round(tot.protein), proteinTarget:t.protein,
      salt:Math.round(tot.salt*10)/10, saltMax:SALT_MAX,
      at:new Date().toISOString() };
  }catch(e){ /* 要約は付随物なので、失敗しても保存は続ける */ }
}
function save(){
  updateSummary();
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ toast('保存に失敗しました'); console.error(e); }
}
function load(){
  S = JSON.parse(JSON.stringify(DEF));
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){
      const o = JSON.parse(raw);
      S = Object.assign(S, o);
      S.profile = Object.assign({}, DEF.profile, o.profile||{});
      S.targets = Object.assign({}, DEF.targets, o.targets||{});
      S.prefs   = Object.assign({}, DEF.prefs,   o.prefs||{});
    }
  }catch(e){ console.error('load', e); }
  if(!S.favorites || !S.favorites.length){
    S.favorites = SEED_FAV.map(f=>Object.assign({id:uid()}, f));
  }
  /* 古い版のお気に入りにも新しい欄を足しておく */
  S.favorites.forEach(f=>{
    if(f.bento === undefined)      f.bento = false;
    /* ★は「献立に使う」印なので、材料を持たない記録専用のものには付けない。
       材料つきの既存分は今までどおり献立に使う（挙動を変えない） */
    if(f.star === undefined)       f.star = (f.ingredients||[]).length > 0;
    if(!Array.isArray(f.ingredients)) f.ingredients = [];
    if(!Array.isArray(f.steps))       f.steps = [];
    if(f.memo === undefined)       f.memo = '';
    if(typeof f.uses !== 'number') f.uses = 0;
  });
  /* 旧版の proteinPerKg（体重基準の数値）を段階に読み替える */
  if(!S.profile.proteinLevel){
    const old = num(S.profile.proteinPerKg);
    S.profile.proteinLevel = old===1.2?'low' : old===1.4?'mid' : old===1.8?'max' : 'high';
  }
  if(!Array.isArray(S.planHistory)) S.planHistory = [];
  if(!Array.isArray(S.suggested))   S.suggested = [];
  apiKey = localStorage.getItem(AKEY) || '';
}
/* AI が出した料理を履歴に控える。同じ名前は新しいほうで置き換える */
function rememberSuggestions(meals){
  (meals||[]).forEach(m=>{
    if(!m || !m.name) return;
    const k = normName(m.name);
    S.suggested = S.suggested.filter(x=>normName(x.name) !== k);
    S.suggested.unshift({ name:m.name, slot:m.slot, bento:!!m.bento,
      kcal:num(m.kcal), protein:num(m.protein), salt:num(m.salt),
      ingredients:m.ingredients||[], steps:m.steps||[], memo:m.memo||'',
      at:new Date().toISOString() });
  });
  S.suggested = S.suggested.slice(0, 40);
}

/* 材料を持つ＝作れるもの（記録で「作った」が押せる） */
function cookableFavs(){ return S.favorites.filter(f=>(f.ingredients||[]).length > 0); }
/* そのうち★が付いたもの＝献立づくりに渡すもの */
function planFavs(){ return cookableFavs().filter(f=>f.star); }
function favByName(name){
  const n = normName(name);
  return S.favorites.find(f=>normName(f.name)===n) || null;
}
function day(k){
  if(!S.days[k]) S.days[k] = { meals:[] };
  if(!S.days[k].meals) S.days[k].meals = [];
  return S.days[k];
}

/* ==========================================================================
   Prep（献立帳）連携 — 在庫と調理履歴
   都度 read → 変更 → write する。読み込んだまま抱えないのは、
   Prep 側で在庫を触られたときに上書きし返す事故を減らすため。
   ========================================================================== */
function prepRead(){
  try{ const raw = localStorage.getItem(PREP_KEY); return raw ? JSON.parse(raw) : null; }
  catch(e){ return null; }
}
function prepWrite(o){
  try{ localStorage.setItem(PREP_KEY, JSON.stringify(o)); return true; }
  catch(e){ toast('在庫の保存に失敗しました'); return false; }
}
function prepStock(){ const p=prepRead(); return (p && Array.isArray(p.stock)) ? p.stock : []; }
function prepAvailable(){ return prepRead() !== null; }

/* 連携が切れているときの案内。
   localStorage は「端末ごと・ブラウザごと」に別物で、同期しない。
   同じ URL でも PC の Chrome と iPhone の Safari は別の入れ物になる。
   ここを黙っていると「連携が壊れた」と誤解されるので、はっきり書く。 */
function linkWarning(){
  if(prepAvailable()) return '';
  return `<div class="warn">
    <b>Prep のデータがここから見えません。</b><br>
    保存場所は<b>端末ごと・ブラウザごと</b>に分かれます。同じ端末でも、
    <b>チャットやSNSのリンクから開いた画面（アプリ内ブラウザ）</b>は
    Safari とは別の入れ物になり、Prep のデータが見えません。<br><br>
    <b>Prep をふだん開いているのと同じブラウザで開き直してください。</b>
    リンクから来た場合は、共有ボタンから「Safariで開く」。<br>
    <span class="muted">ホーム画面に追加したアプリと Safari も、別扱いになることがあります。
    どちらか一方に寄せてください。</span>
  </div>`;
}

/* 材料ぶんの在庫を減らす。Prep の completeCook と同じ規則に揃えてある */
function consumeStock(ings){
  const p = prepRead();
  if(!p || !Array.isArray(p.stock)) return {ok:false, n:0};
  let n=0;
  (ings||[]).forEach(ing=>{
    const it = p.stock.find(s=>normName(s.name)===normName(ing.name));
    if(it && typeof ing.amount === 'number'){
      it.qty = Math.max(0, it.unit===ing.unit ? it.qty - ing.amount : it.qty - 1);
      n++;
    }
  });
  return { ok: prepWrite(p), n };
}

/* 不足分を Prep の買い物リストに送る。買い物と在庫入れは Prep 側でやる。
   （Prep の買い物リストは項目ごとに「在庫へ」ボタンを持っている） */
function sendToPrepShopping(items){
  const p = prepRead();
  if(!p) return {ok:false, n:0, dup:0};
  if(!Array.isArray(p.shoppingList)) p.shoppingList = [];
  let n=0, dup=0;
  items.forEach(it=>{
    const ex = p.shoppingList.find(s=>normName(s.name)===normName(it.name));
    if(ex){ dup++; return; }
    p.shoppingList.push({ id:uid(), name:String(it.name).trim(),
      amount: num(it.amount) || null, unit: it.unit || '',
      checked:false, source:'MAKANAI' });
    n++;
  });
  return { ok: prepWrite(p), n, dup };
}

/* その食材が「在庫 or 常備調味料」にあるか。
   判定規則は Prep の checkIngredientInInventory に合わせてある。
   ここがズレると、Prep では「ある」なのに MAKANAI では「買え」と言い出す。 */
const DANGER_SUFFIX = ['油','オイル','汁','ソース','タレ','たれ','スープ','チューブ','ペースト','パウダー'];
function safePartial(a, b){
  if(a === b) return true;
  const shorter = a.length < b.length ? a : b;
  const longer  = a.length < b.length ? b : a;
  if(shorter.length < 2) return false;
  if(!longer.includes(shorter)) return false;
  for(const suf of DANGER_SUFFIX){ if(longer === shorter + suf) return false; }
  return true;
}
function haveIngredient(name){
  const norm = normName(name);
  if(!norm) return false;
  const p = prepRead(); if(!p) return false;
  const inStock = (p.stock||[]).some(s => num(s.qty) > 0 && safePartial(normName(s.name), norm));
  if(inStock) return true;
  return (p.pantry||[]).some(x => safePartial(normName(x), norm));   // 常備調味料
}

/* 主食と水は買い物リストに出さない。判定は Prep の isStapleRice / isWaterLike に合わせてある。
   主食は栄養に算入するので材料には載るが、都度買うものではない */
function isStaple(name){
  const n = normName(name);
  return /^(米|白米|玄米|精米|ご飯|ごはん|白ごはん|白ご飯|炊いたご飯|炊いたごはん)$/.test(n)
      || /^(水|お湯|湯|熱湯|ぬるま湯|冷水|氷水|水道水)$/.test(n);
}

/* 献立に必要な材料のうち、在庫にも常備調味料にも無いものだけを買い物リストにする。
   AI の出した shoppingList を鵜呑みにせず、こちらで数え直す。 */
function buildShortage(planDaysArr, aiList){
  const out = [], seen = new Set();
  const push = (name, amount, unit, category) => {
    const k = normName(name);
    if(!k || seen.has(k)) return;
    if(isStaple(name)) return;                // 米・水は買い物リストに出さない
    if(haveIngredient(name)) return;          // 冷蔵庫にある／常備している
    seen.add(k);
    out.push({ name:String(name).trim(), amount:num(amount), unit:unit||'', category:category||'その他', sent:false });
  };
  (aiList||[]).forEach(s => push(s.name, s.amount, s.unit, s.category));
  (planDaysArr||[]).forEach(d => (d.meals||[]).forEach(m =>
    (m.ingredients||[]).forEach(i => push(i.name, i.amount, i.unit))));
  return out;
}

/* Prep で「作った」記録のうち、まだ取り込んでいないもの（指定日ぶん） */
function prepCooked(dateKeyStr){
  const p = prepRead();
  if(!p || !Array.isArray(p.history)) return [];
  const done = new Set(S.imported||[]);
  return p.history
    .filter(h => h && h.id && !done.has(h.id))
    .filter(h => { try{ return keyOf(new Date(h.date)) === dateKeyStr; }catch(e){ return false; } })
    .map(h => ({ h, recipe: (p.recipes||[]).find(r=>r.id===h.recipeId) || null }));
}

/* ---------- KIHON 連携（体重・トレ日） ---------- */
function kihonRead(){
  try{ const raw = localStorage.getItem(KIHON_KEY); return raw ? JSON.parse(raw) : null; }
  catch(e){ return null; }
}
function kihonWeightAvg(){
  const k = kihonRead(); if(!k || !k.days) return null;
  const from = addDays(todayKey(), -6);
  const ws = Object.keys(k.days).filter(d=>d>=from)
    .map(d=>k.days[d] && k.days[d].metrics && k.days[d].metrics.weightKg)
    .filter(w=>typeof w === 'number' && w>0);
  if(!ws.length) return null;
  return Math.round(ws.reduce((a,b)=>a+b,0)/ws.length*10)/10;
}
function isTrainingDay(k){
  const kh = kihonRead();
  return !!(kh && kh.days && kh.days[k] && kh.days[k].session);
}
/* その日の体重。MAKANAI に入れた値が優先、無ければ KIHON で測った値を使う。
   トレ後に KIHON で乗るのが自然なので、二重入力させない */
function weightOn(k){
  const own = S.days[k] && S.days[k].weightKg;
  if(typeof own === 'number' && own > 0) return own;
  const kh = kihonRead();
  const w = kh && kh.days && kh.days[k] && kh.days[k].metrics && kh.days[k].metrics.weightKg;
  return (typeof w === 'number' && w > 0) ? w : null;
}
function trainDaysIn(keys){ return keys.filter(isTrainingDay).length; }

/* ==========================================================================
   目標値の計算（Mifflin-St Jeor・女性）
   ========================================================================== */
function targetsFor(k){
  const p = S.profile;
  let kcal=null, protein=null, basis='';
  if(S.targets.manual && S.targets.kcal){
    kcal = num(S.targets.kcal);
    protein = num(S.targets.protein) || proteinTargetOf(p).g;
    basis = '手動設定';
  }else if(p.age && p.heightCm && p.weightKg){
    const bmr  = 10*p.weightKg + 6.25*p.heightCm - 5*p.age - 161;
    const tdee = bmr * num(p.activity || 1.375);
    kcal = Math.round(tdee * num(p.goal || 0.88) / 10) * 10;
    protein = proteinTargetOf(p).g;
    basis = `基礎代謝 ${fmt(bmr)} → 消費 ${fmt(tdee)}`;
  }
  const bonus = (kcal && isTrainingDay(k)) ? num(S.prefs.trainBonus) : 0;
  return { kcal: kcal ? kcal + bonus : null, protein, bonus, basis };
}

/* まだ何も記録していない食事の枠 */
function emptySlots(k){
  const ms = day(k).meals;
  return SLOTS.filter(s=>!ms.some(m=>m.slot===s.id)).map(s=>s.id);
}
function totals(k){
  const ms = day(k).meals;
  return ms.reduce((a,m)=>({
    kcal:a.kcal+num(m.kcal), protein:a.protein+num(m.protein), salt:a.salt+num(m.salt)
  }), {kcal:0, protein:0, salt:0});
}

      h += `<div class="meal">

             value="${ownW!=null?ownW:''}" onchange="setWeight(this.value)">
      <button class="btn btn-ghost" onclick="pullKihonWeight()">KIHONの平均</button>

/* ==========================================================================
   残りのカロリーで組む
   1日ぶんの計画とは別枠。すでに食べたぶんを引いた残りに収まる料理を、
   まだ空いている食事の枠にだけ出す。
   ========================================================================== */
function fillCard(k, t, tot){
  const F = (S.fill && S.fill.date === k) ? S.fill : null;
  const open = emptySlots(k);
  const left = t.kcal ? t.kcal - tot.kcal : null;
  let h = `<div class="card"><h2>残りで組む<span class="sub">在庫とお気に入りから</span></h2>`;

  if(!t.kcal){
    h += `<div class="muted">設定で年齢・身長・体重を入れると、残り枠から提案できます。</div></div>`;
    return h;
  }
  if(F && (F.meals||[]).some(m=>!m.doneAt)){
    const tk = F.meals.filter(m=>!m.doneAt).reduce((a,m)=>a+num(m.kcal),0);
    const tp = F.meals.filter(m=>!m.doneAt).reduce((a,m)=>a+num(m.protein),0);
    h += `<div class="muted" style="margin-bottom:10px">
            まだ食べていない分の合計 <b>${fmt(tk)}kcal ・ たんぱく質 ${tp.toFixed(0)}g</b></div>`;
    F.meals.forEach((m,i)=>{
      if(m.doneAt) return;
      const saved = favByName(m.name);
      const cook = (m.ingredients||[]).length > 0;
      h += `<div class="slot">
        <div class="slot-head">
          <span class="slot-name">${SLOT_NAME[m.slot]||m.slot}</span>
          <span class="slot-kcal">${fmt(m.kcal)}kcal ・ P${num(m.protein).toFixed(0)} ・ 塩${num(m.salt).toFixed(1)}</span>
          <button class="star ${saved?(saved.star?'on':'kept'):''}" onclick="fillFav(${i})" aria-label="保存">${saved ? (saved.star?'★ 保存済':'保存済') : '＋ 保存'}</button>
        </div>
        <div style="font-size:14.5px;margin-bottom:6px">${esc(m.name)}${m.bento?'<span class="tag">弁当</span>':''}</div>
        <div class="row">
          <button class="btn btn-ghost" onclick="openFill(${i})">作り方</button>
          <button class="btn btn-ghost" onclick="fillCook(${i})">${cook?'作った':'食べた'}</button>
        </div></div>`;
    });
    h += `<button class="btn btn-ghost" style="margin-top:12px" onclick="clearFill()">この提案を捨てる</button>`;
  }else if(left <= 0){
    h += `<div class="muted">今日はもう目標に届いています。ここから足す提案は出しません。</div>`;
  }else if(!open.length){
    h += `<div class="muted">朝・昼・夕・間食すべて記録済みです。空いている枠がないので提案はしません。</div>`;
  }else{
    h += `<div class="muted" style="margin-bottom:10px">
            残り <b>${fmt(left)}kcal</b> ・ たんぱく質 <b>あと${Math.max(0, t.protein - tot.protein).toFixed(0)}g</b>
            ・ 空いている枠：${open.map(s=>SLOT_NAME[s]).join('・')}</div>
          <button class="btn" id="fill-go" onclick="makeFill()" ${apiKey?'':'disabled'}>
            ${apiKey?`残り ${fmt(left)}kcal で献立を出す`:'設定でAPIキーを入れてください'}</button>`;
  }
  return h + `</div>`;
}

const FILL_MEAL = {

  required:['slot','name','bento','kcal','protein','salt','calcium','ingredients','steps','memo'],
  properties:{
    slot:{type:'string', enum:['breakfast','lunch','dinner','snack']},
    name:{type:'string'}, bento:{type:'boolean'},
    kcal:{type:'number'}, protein:{type:'number'}, salt:{type:'number'},
    calcium:{type:'number', description:'1人分のカルシウム(mg)'},
    ingredients:{ type:'array', items:{
      type:'object', additionalProperties:false, required:['name','amount','unit'],
      properties:{ name:{type:'string'}, amount:{type:'number'}, unit:{type:'string'} } } },
    steps:{ type:'array', items:{type:'string'} },
    memo:{type:'string'},
  }
};
const FILL_SCHEMA = {
  type:'object', additionalProperties:false, required:['meals','note'],
  properties:{ meals:{ type:'array', items: FILL_MEAL }, note:{type:'string'} }
};

async function makeFill(){
  if(busy) return;
  const k = cursor;
  const btn = document.getElementById('fill-go');
  busy = true; if(btn){ btn.disabled = true; btn.innerHTML = '<span class="spin"></span>考えています…'; }
  try{
    const t = targetsFor(k), tot = totals(k);
    const leftK = t.kcal - tot.kcal;
    const leftP = Math.max(0, t.protein - tot.protein);
    const leftS = Math.max(0, SALT_MAX - tot.salt);
    const open  = emptySlots(k);
    const eaten = day(k).meals.map(m=>`${SLOT_NAME[m.slot]}：${m.name}（${fmt(m.kcal)}kcal）`).join('、') || 'まだ何も記録なし';
    const stock = prepStock();
    const stockTxt = stock.length
      ? stock.map(s=>`${s.name} ${num(s.qty)}${s.unit||''}${s.expiry?`(期限 ${s.expiry})`:''}`).join('、')
      : '（在庫の登録なし）';

${S.prefs.likes?`- 好み：${S.prefs.likes}`:''}

noteには、残り枠の使い方のひとことを1文で。`;

/* ---------- Prep 履歴の取り込み ---------- */
async function importPrep(historyId, slot){
  const p = prepRead(); if(!p) return;
  const h = (p.history||[]).find(x=>x.id===historyId); if(!h) return;
  const recipe = (p.recipes||[]).find(r=>r.id===h.recipeId) || null;
  const name = h.recipeName || (recipe && recipe.name) || '料理';

  let n = recipe ? S.nutrition[recipe.id] : null;
  if(!n && recipe && apiKey){
    toast('栄養を計算しています…', 60000);
    try{
      n = await estimateRecipe(recipe);
      S.nutrition[recipe.id] = Object.assign({at:new Date().toISOString()}, n);
      save();
      toast('計算しました');
    }catch(e){ toast('計算できませんでした：'+e.message, 4000); }
  }
  if(!n){
    /* API が使えない／レシピが消えている場合は手入力にまわす。
       取り込み済みにするのは実際に記録できたときだけ（途中でやめたら一覧に残す） */
    pendingPrepId = historyId;
    addSlot = slot;
    renderAdd('manual');
    setTimeout(()=>{ const el=document.getElementById('m-name'); if(el) el.value = name; }, 0);
    toast('栄養が分からないので手入力にします');
    renderToday();
    return;
  }
  S.imported = (S.imported||[]).concat([historyId]);
  logMeal(cursor, slot, {name, kcal:num(n.kcal), protein:num(n.protein), salt:num(n.salt),
                         source:'prep', prepHistoryId:historyId});
  renderToday();
  toast(`${name} を1人分として記録しました`);
}
function skipPrep(historyId){
  S.imported = (S.imported||[]).concat([historyId]); save(); renderToday();
}

      在庫 ${prepStock().length} 品${prepAvailable()?'':'（Prepのデータが見つかりません）'}
      ・ お気に入り ${cf.length} 品${S.prefs.useFav&&cf.length?'（ここから優先的に組みます）':''}
      ${cookableFavs().length-cf.length>0?`・ 保存のみ ${cookableFavs().length-cf.length} 品（献立には出しません）`:''}
      ${t.kcal?`<br>1日 ${fmt(t.kcal)}kcal / たんぱく質 ${t.protein}g を目安に組みます`:'<br>設定で体格を入れると目安つきで組めます'}
    </div>
    <button class="btn" id="plan-go" onclick="makePlan()" ${apiKey?'':'disabled'}>
      ${apiKey?'献立をつくる':'設定でAPIキーを入れてください'}</button>
    ${planStart===1?`<div class="muted" style="margin-top:8px">
      今夜のうちに仕込むなら、そのまま「作った」を押してください。
      <b>在庫は今すぐ減り、食べた記録は明日に入ります。</b></div>`:''}
  </div>`;

  if((S.planHistory||[]).length){
    h += `<div class="card"><h2>前に作った計画<span class="sub">${S.planHistory.length}件</span></h2><div class="chips">`;
    S.planHistory.forEach((p,i)=>{
      const d0 = (p.days&&p.days[0]) ? p.days[0].date : '';
      /* 「今日から/明日から」のチップと紛らわしいので「…の計画」と書く */
      h += `<button class="chip sm" onclick="restorePlan(${i})">${d0?esc(labelOf(d0).split('・')[0]):''}の計画</button>`;
    });
    h += `</div><div class="muted" style="margin-top:8px">呼び戻すと、今の計画は履歴に移ります。作り直さずに済みます。</div></div>`;
  }

  const P = S.plan;
  if(P && P.days){
    (P.days||[]).forEach((d,di)=>{
      const dt = d.date===todayKey() ? '今日' : labelOf(d.date);
      const dk = (d.meals||[]).reduce((a,m)=>a+num(m.kcal),0);
      const dp = (d.meals||[]).reduce((a,m)=>a+num(m.protein),0);
      const dc = (d.meals||[]).reduce((a,m)=>a+num(m.calcium),0);
      h += `<div class="card"><h2>${esc(dt)}<span class="sub">${fmt(dk)}kcal ・ P${dp.toFixed(0)}g</span></h2>
        ${dc?`<div class="kv" style="margin-bottom:6px"><span>カルシウム</span>
          <b style="color:${dc>=CALCIUM_TARGET?'var(--good)':'var(--warn)'}">${fmt(dc)} / ${CALCIUM_TARGET} mg</b></div>`:''}
        ${di===0?`<div class="muted" style="margin-bottom:6px">
          <b>「＋ 保存」</b>で材料と作り方ごと控えられます。<b>献立にも使いたいときは、
          「作り方」の中で★を付けてください。</b></div>`:''}`;
      (d.meals||[]).forEach((m,mi)=>{
        const saved = favByName(m.name);
        h += `<div class="slot">
          <div class="slot-head">
            <span class="slot-name">${SLOT_NAME[m.slot]||m.slot}</span>
            <span class="slot-kcal">${fmt(m.kcal)}kcal ・ P${num(m.protein).toFixed(0)} ・ 塩${num(m.salt).toFixed(1)}</span>
            <button class="star ${saved?(saved.star?'on':'kept'):''}" onclick="saveDishAsFav(${di},${mi})"
                    aria-label="保存">${saved ? (saved.star?'★ 保存済':'保存済') : '＋ 保存'}</button>
          </div>

          <div class="row">
            <button class="btn btn-ghost" onclick="openDish(${di},${mi})">作り方</button>

          </div>
        </div>`;
      });
      h += `</div>`;
    });

    if((P.prep||[]).length){
      h += `<div class="card"><h2>前日・まとめての準備</h2>`;
      P.prep.forEach((s,i)=>{
        h += `<div class="li ${s.done?'done':''}">
                <input type="checkbox" ${s.done?'checked':''} onchange="togglePrepStep(${i})">
                <span class="n"><b style="font-size:12px;color:var(--text-muted)">${esc(s.when)}</b><br>${esc(s.text)}</span>
              </div>`;
      });
      h += `</div>`;
    }

    if((P.shopping||[]).length){
      const unsent = P.shopping.filter(s=>!s.sent);
      h += `<div class="card"><h2>足りないもの<span class="sub">${P.shopping.length} 品</span></h2>`;
      P.shopping.forEach(s=>{
        h += `<div class="li ${s.sent?'done':''}">
                <span class="n">${esc(s.name)} <span class="muted">${num(s.amount)?fmt(s.amount)+esc(s.unit||''):''}</span>
                  ${s.sent?'<span class="tag g">送信済</span>':''}</span>
              </div>`;
      });
      h += `<button class="btn" style="margin-top:12px" onclick="pushShopping()" ${unsent.length?'':'disabled'}>
              ${unsent.length?`Prepの買い物リストに送る（${unsent.length}品）`:'すべて送信済み'}</button>
            <div class="muted" style="margin-top:8px">
              買い物は<b>Prepの買い物リスト</b>で。買ったものにチェックを入れて「在庫へ」を押すと冷蔵庫に入り、
              こちらの献立にも反映されます。</div></div>`;
    }
    if(P.note) h += `<div class="card"><h2>ひとこと</h2><div class="muted">${esc(P.note)}</div></div>`;
  }
  h += suggestedCard();
  el.innerHTML = h;
}

/* これまでに出た提案の控え。捨てた献立からも拾える */
let sugAll = false;
function suggestedCard(){
  const list = S.suggested || [];
  if(!list.length) return '';
  const show = sugAll ? list : list.slice(0, 8);
  let h = `<div class="card"><h2>これまでの提案<span class="sub">${list.length}品</span></h2>
    <div class="muted" style="margin-bottom:8px">
      AIが出した料理は、保存しなくてもここに残ります（新しい順・最大40品）。</div>`;
  show.forEach((m,i)=>{
    const sv = favByName(m.name);
    h += `<button class="pick" onclick="openSuggested(${list.indexOf(m)})">
            <span class="n">${sv?(sv.star?'★ ':'✓ '):''}${esc(m.name)}
              <span class="muted">${SLOT_NAME[m.slot]||''}</span>${m.bento?'<span class="tag">弁当</span>':''}</span>
            <span class="v">${fmt(m.kcal)}kcal ・ P${num(m.protein).toFixed(0)}</span>
          </button>`;
  });
  if(list.length > 8){
    h += `<button class="btn btn-ghost" style="margin-top:10px" onclick="sugAll=!sugAll;renderPlan()">
            ${sugAll?'たたむ':`のこり ${list.length-8} 品を見る`}</button>`;
  }
  return h + `</div>`;
}
function openSuggested(i){
  const m = (S.suggested||[])[i]; if(!m) return;
  const sv = favByName(m.name);
  const cook = (m.ingredients||[]).length > 0;
  let h = `<h3>${esc(m.name)}<button class="x" onclick="closeSheet()">×</button></h3>
    <div class="muted" style="margin-bottom:10px">${fmt(m.kcal)}kcal ・ たんぱく質 ${num(m.protein).toFixed(0)}g ・ 塩分 ${num(m.salt).toFixed(1)}g</div>`;
  if(cook){
    h += `<div class="sec-label">材料（1人分）</div>`;
    m.ingredients.forEach(x=>{
      h += `<div class="li"><span class="n">${esc(x.name)}</span><span class="muted">${num(x.amount)?fmt(x.amount)+esc(x.unit||''):esc(x.unit||'')}</span></div>`;
    });
  }
  if((m.steps||[]).length){
    h += `<div class="sec-label">作り方</div>`;
    m.steps.forEach((x,n)=>{ h += `<div class="li"><span class="n"><b>${n+1}.</b> ${esc(x)}</span></div>`; });
  }
  if(m.memo) h += `<div class="sec-label">メモ</div><div class="muted">${esc(m.memo)}</div>`;
  h += `<button class="btn" style="margin-top:14px" onclick="sugCook(${i})">
          ${cook?'今日つくる（在庫を減らして記録）':'今日に記録する'}</button>
        <button class="btn btn-ghost" style="margin-top:8px" onclick="sugSave(${i})">
          ${sv?'保存した内容を更新する':'＋ 保存する（材料と作り方を控える）'}</button>`;
  if(sv){
    h += `<button class="btn btn-ghost" style="margin-top:8px" onclick="toggleStar('${esc(m.name).replace(/'/g,"\\'")}', ()=>{renderPlan();openSuggested(${i})})">
            ${sv.star?'★ お気に入りを外す（保存は残る）':'☆ お気に入りにする（献立に使う）'}</button>`;
  }
  h += `<button class="btn btn-danger" style="margin-top:8px" onclick="sugDrop(${i})">この提案を履歴から消す</button>`;
  openSheet(h);
}
function sugSave(i){
  const m = S.suggested[i]; if(!m) return;
  saveDish({ name:m.name, slot:m.slot, bento:!!m.bento,
             kcal:num(m.kcal), protein:num(m.protein), salt:num(m.salt),
             ingredients:m.ingredients||[], steps:m.steps||[], memo:m.memo||'' },
           ()=>{ renderPlan(); openSuggested(i); });
}
function sugCook(i){
  const m = S.suggested[i]; if(!m) return;
  const cook = (m.ingredients||[]).length > 0;
  const r = cook ? consumeStock(m.ingredients) : {ok:true, n:0};
  logMeal(todayKey(), m.slot, {name:m.name, kcal:num(m.kcal), protein:num(m.protein),
                               salt:num(m.salt), bento:!!m.bento, source:'sug'});

  toast(r.n ? `今日に記録しました（在庫を${r.n}品減らしました）` : '今日に記録しました');

/* 計画の料理を保存する。材料・手順・栄養ごと持っていくので、次から作り直せる。
   ★（献立に使う）は立てない。控えておきたいだけの料理もあるため、別操作にしてある */
function saveDish(o, after){
  const ex = favByName(o.name);
  if(ex){ Object.assign(ex, o); toast('保存した内容を更新しました'); }
  else  { S.favorites.push(Object.assign({id:uid(), uses:0, star:false}, o)); toast('保存しました'); }
  save(); if(after) after();
}
function saveDishAsFav(di,mi){
  const m = S.plan.days[di].meals[mi];
  saveDish({ name:m.name, slot:m.slot, bento:!!m.bento,
             kcal:num(m.kcal), protein:num(m.protein), salt:num(m.salt),
             ingredients:m.ingredients||[], steps:m.steps||[], memo:m.memo||'' }, renderPlan);
}
/* ★の付け外し。名前で引く（保存済みでなければ何もしない） */
function toggleStar(name, after){
  const f = favByName(name); if(!f) return;
  f.star = !f.star; save();
  toast(f.star ? 'お気に入りにしました（献立に使います）' : 'お気に入りを外しました（保存は残ります）');
  if(after) after();
}
/* 前に作った計画を呼び戻す。今の計画は履歴に移す（捨てない） */
function restorePlan(i){
  const p = (S.planHistory||[])[i]; if(!p) return;
  S.planHistory.splice(i,1);
  if(S.plan) S.planHistory.unshift(S.plan);
  S.planHistory = S.planHistory.slice(0,5);
  S.plan = p;
  save(); renderPlan(); renderToday();
  toast('前の計画を呼び戻しました');
}
function cookDish(di,mi){
  const d = S.plan.days[di], m = d.meals[mi];
  if(m.doneAt) return;
  const r = consumeStock(m.ingredients);
  const k = d.date || todayKey();
  logMeal(k, m.slot, {name:m.name, kcal:num(m.kcal), protein:num(m.protein), salt:num(m.salt),
                      bento:!!m.bento, source:'plan', planRef:`${di}:${mi}`});
  markPlanDone(`${di}:${mi}`);
  renderPlan(); renderToday();
  toast(r.ok ? `記録しました（在庫を${r.n}品減らしました）` : '記録しました（在庫は更新できませんでした）');
}
function markPlanDone(ref){
  const [di,mi] = ref.split(':').map(Number);
  if(S.plan && S.plan.days[di] && S.plan.days[di].meals[mi]){
    S.plan.days[di].meals[mi].doneAt = new Date().toISOString();
  }
  save();
}
function unmarkPlanDone(ref){
  const [di,mi] = ref.split(':').map(Number);
  if(S.plan && S.plan.days[di] && S.plan.days[di].meals[mi]) delete S.plan.days[di].meals[mi].doneAt;
}
function togglePrepStep(i){ S.plan.prep[i].done = !S.plan.prep[i].done; save(); renderPlan(); }
function pushShopping(){
  const items = (S.plan.shopping||[]).filter(s=>!s.sent);
  if(!items.length) return;
  const r = sendToPrepShopping(items);
  if(!r.ok){ toast('Prepのデータが見つかりません'); return; }
  items.forEach(s=>s.sent=true);
  save(); renderPlan();
  toast(r.dup ? `${r.n}品を送りました（${r.dup}品は既にリストにあります）` : `Prepの買い物リストに${r.n}品送りました`);
}

/* ==========================================================================
   ふりかえり — 「食べた量」と「体重の動き」を突き合わせて、次の一手を出す
   ここが KIHON 連携のいちばんの目的。体重は KIHON、食事は MAKANAI にあるので、
   両方が揃って初めて「今の食べ方で合っているか」が言える。
   ========================================================================== */
function review(keys){
  const t = targetsFor(todayKey());
  const wpts = keys.map((k,i)=>({i, v:weightOn(k)})).filter(p=>p.v!=null);
  const eaten = keys.filter(k=>totals(k).kcal > 0);
  const avgKcal = eaten.length ? eaten.reduce((a,k)=>a+totals(k).kcal,0)/eaten.length : null;
  const avgPro  = eaten.length ? eaten.reduce((a,k)=>a+totals(k).protein,0)/eaten.length : null;
  const trains  = trainDaysIn(keys);

  /* 最小二乗法で体重の傾き（kg/日）を出す。点が少ないうちは出さない */
  let slope = null, span = 0;
  if(wpts.length >= 4){
    span = wpts[wpts.length-1].i - wpts[0].i;
    if(span >= 6){
      const n = wpts.length;
      const mx = wpts.reduce((a,p)=>a+p.i,0)/n;
      const my = wpts.reduce((a,p)=>a+p.v,0)/n;
      let num=0, den=0;
      wpts.forEach(p=>{ num += (p.i-mx)*(p.v-my); den += (p.i-mx)*(p.i-mx); });
      if(den > 0) slope = num/den;
    }
  }
  const wNow = wpts.length ? wpts[wpts.length-1].v : (S.profile.weightKg || null);
  const perWeek = slope!=null ? slope*7 : null;
  const pct = (perWeek!=null && wNow) ? perWeek/wNow*100 : null;

  /* 判定。根拠のない断定はしない */
  let band = 'unknown', head = '', advice = '';
  if(pct == null){
    band = 'unknown';
    const need = Math.max(0, 4 - wpts.length);
    head = 'まだ傾向は出せません';
    advice = wpts.length < 4
      ? `体重の記録があと${need}日ぶん貯まると、増減のペースを出します。KIHONで測った体重も自動で拾います。`
      : '記録の期間が短いので、あと数日ぶん様子を見ます。';
  }else if(pct <= -0.8){
    band='fast';  head = '落ちるのが速すぎます';
    advice = 'この速さは筋肉も一緒に減ります。1日あたり150〜200kcal 増やして、週0.3〜0.5%に落としてください。';
  }else if(pct <= -0.15){
    band='good';  head = '狙いどおりのペースです';
    advice = 'このまま続けてください。数字をいじる必要はありません。';
  }else if(pct < 0.15){
    band='flat';  head = '体重は横ばいです';
    advice = (avgKcal!=null && t.kcal && avgKcal <= t.kcal + 50)
      ? '目標どおり食べているのに減っていません。目標カロリーが実態より高い可能性があります。150kcal 下げて2週間みてください。'
      : '目標を超えて食べている日が多いようです。まず目標に寄せるところからです。';
  }else{
    band='up';    head = '体重は増えています';
    advice = (avgKcal!=null && t.kcal && avgKcal > t.kcal)
      ? `平均で目標を ${fmt(avgKcal - t.kcal)}kcal 超えています。まずここを埋めてください。`
      : '記録されていない食事があるかもしれません。間食と飲み物を入れてみてください。';
  }

  /* たんぱく質。減量中にここが落ちると筋肉が減る */
  let proWarn = '';
  if(avgPro != null && t.protein && avgPro < t.protein*0.85){
    proWarn = `たんぱく質が平均 ${avgPro.toFixed(0)}g で、目標 ${t.protein}g に届いていません。`
            + `減らしている最中にここが不足すると筋肉から落ちます。あと ${Math.ceil(t.protein-avgPro)}g、`
            + `卵1個＋ヨーグルト、またはサラダチキン1個ぶんです。`;
  }
  return { band, head, advice, proWarn, perWeek, pct, avgKcal, avgPro, trains,
           recorded: eaten.length, wCount: wpts.length, target:t };
}

/* ==========================================================================
   画面：記録
   ========================================================================== */
function renderLog(){
  const el = document.getElementById('log-body');
  const days = [];
  for(let i=13;i>=0;i--){ const k = addDays(todayKey(), -i); days.push(k); }
  const t = targetsFor(todayKey());

  const kcalData = days.map(k=>({k, v: totals(k).kcal}));
  const proData  = days.map(k=>({k, v: totals(k).protein}));
  const wData    = days.map(k=>({k, v: weightOn(k)}));

  const rec = days.filter(k=>totals(k).kcal>0);
  const avg7 = (arr)=>{ const a=arr.slice(-7).filter(x=>x.v); return a.length? a.reduce((s,x)=>s+x.v,0)/a.length : null; };
  const a7k = avg7(kcalData), a7p = avg7(proData);
  const R = review(days);

  /* --- ふりかえり（この画面の主役） --- */
  let h = '';
  const tone = {fast:'var(--warn)', good:'var(--good)', flat:'var(--warn)', up:'var(--bad)', unknown:'var(--text-muted)'}[R.band];
  h += `<div class="card"><h2>ふりかえり<span class="sub">この2週間</span></h2>
    <div style="font-size:17px;font-weight:700;color:${tone};margin-bottom:6px">${esc(R.head)}</div>`;
  if(R.perWeek != null){
    const sign = R.perWeek < 0 ? '−' : '＋';
    h += `<div class="hero" style="margin-bottom:8px">
            <b>${sign}${Math.abs(R.perWeek).toFixed(2)}</b><span class="u">kg / 週（${R.pct.toFixed(2)}%）</span></div>`;
  }
  h += `<div style="font-size:14px;color:var(--text-secondary)">${esc(R.advice)}</div>`;
  if(R.proWarn) h += `<div style="font-size:14px;color:var(--text-secondary);margin-top:10px;
                        border-top:1px solid var(--line);padding-top:10px">${esc(R.proWarn)}</div>`;
  h += `<div class="kv" style="margin-top:12px"><span>食事を記録した日</span><b>${R.recorded} / 14 日</b></div>

/* 折れ線1本ぶん。左に目盛り、右端に値。値がなければ描かない */
function drawChart(id, data, o){
  const host = document.getElementById(id); if(!host) return;
  const pts = data.filter(d=>d.v!=null && d.v>0);
  if(pts.length < 2){ host.innerHTML = `<div class="muted">データが2日ぶん貯まると線になります。</div>`; return; }
  const W=560, H=150, L=38, R=52, T=12, B=22;
  const vals = pts.map(d=>d.v).concat(o.target?[o.target]:[]);
  let lo=Math.min(...vals), hi=Math.max(...vals);
  if(hi===lo){ hi=lo+1; lo=lo-1; }
  const pad=(hi-lo)*0.15; lo-=pad; hi+=pad;
  const xi = k => data.findIndex(d=>d.k===k);
  const X = i => L + (W-L-R) * (data.length<2?0:i/(data.length-1));
  const Y = v => T + (H-T-B) * (1 - (v-lo)/(hi-lo));

  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">`;
  [lo+ (hi-lo)*0.1, (lo+hi)/2, hi-(hi-lo)*0.1].forEach(v=>{
    s += `<line x1="${L}" y1="${Y(v).toFixed(1)}" x2="${W-R}" y2="${Y(v).toFixed(1)}" stroke="var(--grid)" stroke-width="1"/>`;
    s += `<text x="${L-6}" y="${(Y(v)+4).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--text-muted)">${o.dec?v.toFixed(1):Math.round(v)}</text>`;
  });
  if(o.target){
    s += `<line x1="${L}" y1="${Y(o.target).toFixed(1)}" x2="${W-R}" y2="${Y(o.target).toFixed(1)}"
            stroke="var(--text-muted)" stroke-width="1" stroke-dasharray="4 4"/>`;
  }
  const d = pts.map((p,i)=>`${i?'L':'M'}${X(xi(p.k)).toFixed(1)},${Y(p.v).toFixed(1)}`).join(' ');
  s += `<path d="${d}" fill="none" stroke="${o.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  const last = pts[pts.length-1];
  s += `<circle cx="${X(xi(last.k)).toFixed(1)}" cy="${Y(last.v).toFixed(1)}" r="4" fill="${o.color}" stroke="var(--surface-1)" stroke-width="2"/>`;
  s += `<text x="${W-R+7}" y="${(Y(last.v)+4).toFixed(1)}" font-size="11.5" font-weight="700" fill="${o.color}">${o.dec?last.v.toFixed(1):fmt(last.v)}</text>`;
  const f=data[0], l=data[data.length-1];
  s += `<text x="${L}" y="${H-5}" font-size="10" fill="var(--text-muted)">${dateOf(f.k).getMonth()+1}/${dateOf(f.k).getDate()}</text>`;
  s += `<text x="${W-R}" y="${H-5}" text-anchor="end" font-size="10" fill="var(--text-muted)">${dateOf(l.k).getMonth()+1}/${dateOf(l.k).getDate()}</text>`;
  s += `</svg><div class="legend">単位：${o.unit}</div>`;
  host.innerHTML = s;
}

function saveFav(id){
  const o = {
    name:(document.getElementById('f-name').value||'').trim(),
    slot:document.getElementById('f-slot').value,
    bento:document.getElementById('f-bento').checked,
    star:document.getElementById('f-star').checked,
    kcal:num(document.getElementById('f-kcal').value),
    protein:num(document.getElementById('f-pro').value),
    salt:num(document.getElementById('f-salt').value),
  };
  if(!o.name){ toast('名前を入れてください'); return; }
  if(id){ Object.assign(S.favorites.find(x=>x.id===id), o); }   // 材料・手順はそのまま残す
  else S.favorites.push(Object.assign({id:uid(), uses:0, ingredients:[], steps:[], memo:''}, o));
  save(); closeSheet(); renderSet(); toast('保存しました');
}
function delFav(id){
  S.favorites = S.favorites.filter(x=>x.id!==id);
  save(); closeSheet(); renderSet();
}
function exportData(){
  const blob = new Blob([JSON.stringify(S,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `makanai-${todayKey()}.json`;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}
function importData(ev){
  const f = ev.target.files && ev.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const o = JSON.parse(r.result);
      if(o.app !== 'makanai') throw new Error('MAKANAIのデータではありません');
      S = Object.assign(JSON.parse(JSON.stringify(DEF)), o);
      save(); renderAll(); toast('読み込みました');
    }catch(e){ toast('読み込めません：'+e.message, 4000); }
  };
  r.readAsText(f);
  ev.target.value = '';
}

      'x-api-key':apiKey,
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true',
    },
    body: JSON.stringify(body),
  });
  if(!res.ok){
    const e = await res.json().catch(()=>({}));
    const msg = (e.error && e.error.message) || `APIエラー ${res.status}`;
    const err = new Error(msg); err.status = res.status; throw err;
  }
  return res.json();
}
function textOf(r){
  return (r.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('\n');
}
/* 構造化出力で受け取る。古い経路に落ちたときのためJSON抜き出しも残す */
function looseJSON(text){
  if(!text) throw new Error('空の応答');
  let s = text.replace(/```json\s*/gi,'').replace(/```/g,'').trim();
  const a = s.indexOf('{'), b = s.lastIndexOf('}');
  if(a>=0 && b>a) s = s.slice(a, b+1);
  return JSON.parse(s);
}
async function askJSON(prompt, schema, maxTokens){
  const base = { model:S.prefs.model||'claude-opus-5', max_tokens:maxTokens||8000,
                 messages:[{role:'user', content:prompt}] };
  try{
    const r = await callClaude(Object.assign({}, base,
      { output_config:{ format:{ type:'json_schema', schema } } }));
    return looseJSON(textOf(r));
  }catch(e){
    if(e.status && e.status >= 500) throw e;
    /* 構造化出力が通らない環境では、指示だけでJSONを書かせる */
    const r = await callClaude(Object.assign({}, base, {
      messages:[{role:'user', content: prompt +
        '\n\n出力はこのJSONスキーマに厳密に従うこと。JSONだけを返し、前置きも説明もコードブロックも付けない。\n' +
        JSON.stringify(schema)}]
    }));
    return looseJSON(textOf(r));
  }
}

const NUTRI_SCHEMA = {
  type:'object', additionalProperties:false,
  required:['kcal','protein','salt'],
  properties:{
    kcal:{type:'number', description:'1人分のエネルギー(kcal)'},
    protein:{type:'number', description:'1人分のたんぱく質(g)'},
    salt:{type:'number', description:'1人分の食塩相当量(g)'},
  }
};

const MEAL_SCHEMA = {
  type:'object', additionalProperties:false,
  required:['slot','name','bento','kcal','protein','salt','calcium','ingredients','steps','memo'],
  properties:{
    slot:{type:'string', enum:['breakfast','lunch','dinner']},
    name:{type:'string'},
    bento:{type:'boolean', description:'お弁当に詰めて持って行くものなら true'},
    kcal:{type:'number'}, protein:{type:'number'}, salt:{type:'number'},
    calcium:{type:'number', description:'1人分のカルシウム(mg)'},
    ingredients:{ type:'array', items:{
      type:'object', additionalProperties:false, required:['name','amount','unit'],
      properties:{ name:{type:'string'}, amount:{type:'number'}, unit:{type:'string'} } } },
    steps:{ type:'array', items:{type:'string'} },
    memo:{type:'string'},
  }
};
const PLAN_SCHEMA = {
  type:'object', additionalProperties:false,
  required:['days','prep','shopping','note'],
  properties:{
    days:{ type:'array', items:{
      type:'object', additionalProperties:false, required:['date','meals'],
      properties:{ date:{type:'string', description:'YYYY-MM-DD'},
                   meals:{ type:'array', items: MEAL_SCHEMA } } } },
    prep:{ type:'array', items:{
      type:'object', additionalProperties:false, required:['when','text'],

    shopping:{ type:'array', items:{
      type:'object', additionalProperties:false, required:['name','amount','unit','category'],
      properties:{ name:{type:'string'}, amount:{type:'number'}, unit:{type:'string'},
                   category:{type:'string', enum:['野菜','肉・魚','卵・乳製品','調味料','乾物・麺','その他']} } } },
    note:{type:'string'},
  }
};

/* Prep のレシピ1人分の栄養を、このアプリ側で計算する */
async function estimateRecipe(recipe){
  const sv = num(recipe.servings) || 2;
  const ings = (recipe.ingredients||[])
    .map(i=>`${i.name} ${i.amount!=null?i.amount:''}${i.unit||''}`).join('、');
  const prompt =
`次の料理の栄養価を推定してください。分量は全体量（${sv}人分）です。
料理名：${recipe.name}
材料（全体）：${ings || '不明'}

「1人分」（全体を${sv}で割った量）のエネルギー・たんぱく質・食塩相当量を、日本食品標準成分表に基づいて数値で答えてください。`;
  const o = await askJSON(prompt, NUTRI_SCHEMA, 2000);
  return { kcal:num(o.kcal), protein:num(o.protein), salt:num(o.salt) };
}

/* 手入力シートの「名前から栄養を推定する」 */
async function guessNutrition(){
  const name = (document.getElementById('m-name').value||'').trim();
  if(!name){ toast('先に名前を入れてください'); return; }
  const l = document.getElementById('guess-l');
  l.innerHTML = '<span class="spin"></span>計算中…';
  try{
    const o = await askJSON(
      `「${name}」を1人前食べたときのエネルギー・たんぱく質・食塩相当量を、日本の一般的な量で推定してください。`,
      NUTRI_SCHEMA, 2000);
    document.getElementById('m-kcal').value = Math.round(num(o.kcal));
    document.getElementById('m-pro').value  = Math.round(num(o.protein)*10)/10;
    document.getElementById('m-salt').value = Math.round(num(o.salt)*10)/10;
    l.textContent = '推定しました（直せます）';
  }catch(e){
    l.textContent = '名前から栄養を推定する';
    toast('推定できませんでした：'+e.message, 4000);
  }
}

/* ---------- 献立づくり ---------- */
async function makePlan(){
  if(busy) return;
  const btn = document.getElementById('plan-go');
  busy = true; btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span>考えています… 1分ほどかかります';
  try{
    const t = targetsFor(todayKey());
    const stock = prepStock();
    const dates = planDates();
    const stockTxt = stock.length
      ? stock.map(s=>`${s.name} ${num(s.qty)}${s.unit||''}${s.expiry?`(期限 ${s.expiry})`:''}`).join('、')
      : '（在庫の登録なし）';
    const recent = Object.keys(S.days).sort().slice(-5)
      .flatMap(k=>day(k).meals.map(m=>m.name)).slice(-15);

    /* お気に入り中心モード：材料つきのお気に入りを渡し、そこから優先的に組ませる */
    const favs = S.prefs.useFav ? planFavs() : [];
    const favTxt = favs.map(f=>
      `・${f.name}（${SLOT_NAME[f.slot]||''}${f.bento?'・弁当可':''} / ${fmt(f.kcal)}kcal / P${num(f.protein).toFixed(0)}g / 塩${num(f.salt).toFixed(1)}g）`
      + ` 材料: ${(f.ingredients||[]).map(i=>`${i.name}${num(i.amount)?num(i.amount)+(i.unit||''):''}`).join('、')}`
    ).join('\n');
    const favBlock = favs.length ? `

【お気に入り（できるだけこの中から選ぶ）】
${favTxt}

- 献立の中心はお気に入りにする。在庫・栄養・弁当の条件に合うものがあれば、必ずそれを使う
- お気に入りを使うときは、**名前・材料・手順をそのまま**出す（勝手に作り変えない）
- 条件に合うお気に入りが足りないときだけ、新しい料理を足す
- ただし同じ料理を1日に2回は出さない` : '';

    const prompt =
`あなたは日本の家庭料理に詳しい管理栄養士です。40〜50代女性1人ぶんの食事計画を${planDays}日分つくってください。

【この人の目標】
${t.kcal ? `1日 ${t.kcal - t.bonus} kcal / たんぱく質 ${t.protein} g / 食塩相当量 ${SALT_MAX} g 以下` : '一般的な成人女性の基準'}
すべて**1人ぶん**の量。家族の分は含めない。
体脂肪を減らしながら筋肉を保ちたい。たんぱく質は毎食に分けて入れる。

【日付】
${dates.map((d,i)=>`${i+1}日目：${d}`).join(' / ')}
今日は ${todayKey()}。${planStart===1 ? '**明日ぶんからの計画**なので、仕込みは「今夜」のうちにできる形にする。' : ''}

【冷蔵庫にあるもの（これを先に使い切る。期限が近いものを優先）】
${stockTxt}
${favBlock}

【条件】
- 朝食・昼食・夕食の3食を必ず作ること。1日3件のmealsにする
- 朝は10分以内でできるものにする${S.prefs.bento?'\n- 昼はお弁当にする。前日の夜に作り置きして詰められるものにし、bentoをtrueにする。冷めてもおいしく、汁気が出ないもの' : ''}
- 外食やコンビニに頼らず自分で作れる献立にする
- 同じ主菜を繰り返さない。和洋中を散らす
- **1日のカルシウムを ${CALCIUM_TARGET}mg 以上にする。**50代女性は骨量が落ちやすく、
  減量中はさらに落ちやすい。乳製品・小魚・大豆製品（豆腐/納豆/厚揚げ）・青菜（小松菜・チンゲン菜）
  ・ごまを毎日どこかに入れる。各料理の calcium に1人分のmgを入れること
- 鉄（赤身肉・レバー・あさり・小松菜）と食物繊維（野菜・きのこ・海藻・豆）も日々入れる。
  ビタミンDは骨に効くので、鮭・さんま・さば・きのこを週に数回入れる
- 野菜は1日350g以上を目安に、色の濃い野菜を毎日入れる
- **主食（ごはん・パン・麺）も1食に含め、材料と栄養に必ず算入すること。**
  分量は具体的に書く（例「ごはん 150g」「食パン6枚切 1枚」）。
  主食を出さない食事にするなら、memoに「主食なし」と明記する
- 分量・栄養価はすべて「1人分」で答える
- 材料のnameは冷蔵庫の表記に合わせる（例「鶏むね肉」）。amountは数値、unitは g / ml / 個 / 本 / 枚 / パック などの単位
- stepsは1品につき2〜4行の短い手順
- prepには、まとめて仕込む作業を「いつ・何をする」の形で書く（前日夜の下ごしらえ、弁当の詰め方など）
- shoppingには、冷蔵庫にないので買う必要があるものだけを入れる。すでにあるものは入れない
${S.prefs.avoid?`- 避ける：${S.prefs.avoid}`:''}
${S.prefs.likes?`- 好み：${S.prefs.likes}`:''}
${recent.length?`- 最近食べたもの（続けない）：${recent.join('、')}`:''}

noteには、この${planDays}日をうまく回すためのひとことを1〜2文で。`;

    const o = await askJSON(prompt, PLAN_SCHEMA, 16000);
    const pdays = (o.days||[]).map((d,i)=>({ date: dates[i] || d.date, meals: d.meals||[] }));

    rememberSuggestions(pdays.flatMap(d=>d.meals||[]));
    S.plan = {
      id: uid(), createdAt: new Date().toISOString(),
      days: pdays,
      prep: (o.prep||[]).map(x=>Object.assign({done:false}, x)),
      /* AI の買い物リストは当てにせず、在庫と常備品を引いて数え直す */
      shopping: buildShortage(pdays, o.shopping),
      note: o.note || '',
    };
    save();
    toast('献立ができました');
  }catch(e){
    toast('うまくいきませんでした：'+e.message, 5000);
    console.error(e);
  }finally{
    busy = false;
    renderPlan();
  }
}

function renderAll(){ renderToday(); renderPlan(); renderLog(); renderSet(); updateSub(); }
function updateSub(){
  const t = targetsFor(todayKey()), tot = totals(todayKey());
  document.getElementById('h-sub').textContent = t.kcal
    ? `今日 ${fmt(tot.kcal)} / ${fmt(t.kcal)} kcal` : '賄い';
}
document.querySelectorAll('nav button').forEach(b=>{
  b.addEventListener('click', ()=>{
    const v = b.dataset.view;
    document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on', x===b));
    document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on', x.id==='v-'+v));
    if(v==='today'){ cursor = cursor || todayKey(); renderToday(); }
    if(v==='plan') renderPlan();
    if(v==='log')  renderLog();
    if(v==='set')  renderSet();
    updateSub();
    window.scrollTo(0,0);
  });
});
